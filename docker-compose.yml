# Zakura — AI 环境编排 & 统一 MCP 网关
#
# 默认拉取 Docker Hub 开发镜像（自托管，内嵌 PGlite）：
#   docker compose up -d
#
# 本地构建：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 使用外部 Postgres（多租户 / 生产）：
#   docker compose --profile postgres up -d
#   并将 zakura 的 DATABASE_URL 指到 postgres 服务
#
# 可选组件：
#   docker compose --profile components up -d

services:
  zakura:
    image: ${ZAKURA_IMAGE:-sunwuyuan/zakura-dev:latest}
    container_name: zakura
    # 经 nginx 对外；直连调试可取消注释
    # ports:
    #   - "8787:8787"
    #   - "3000:3001"
    expose:
      - "8787"
      - "3001"
    environment:
      # 默认内嵌 PGlite；云端改为 postgresql://zakura:zakura@postgres:5432/zakura
      DATABASE_URL: ${DATABASE_URL:-pglite:/data/pglite}
      ZAKURA_DATA_DIR: /data
      ZAKURA_PUBLIC_URL: ${ZAKURA_PUBLIC_URL:-https://preview.moonrend.com}
      ZAKURA_WEB_URL: ${ZAKURA_WEB_URL:-https://preview.moonrend.com}
      HOST: 0.0.0.0
      PORT: 8787
      # 部署形态：oss（默认单租户）| saas（多租户 / 自助注册，镜像内需含 @zakura/saas）
      ZAKURA_EDITION: ${ZAKURA_EDITION:-oss}
      # 工作区 / Runner 默认镜像（可由环境覆盖）
      ZAKURA_WORKSPACE_IMAGE: ${ZAKURA_WORKSPACE_IMAGE:-sunwuyuan/zakura-workspace-dev:debian}
      ZAKURA_RUNNER_IMAGE: ${ZAKURA_RUNNER_IMAGE:-sunwuyuan/zakura-runner-dev:latest}
      # 平台自托管 Headscale：数据面由 zakura-host-ts（host 网 + kernel TUN）加入本机网。
      # 控制面主机勿再跑个人 Tailscale 内核客户端，否则会与 host-ts 抢 TUN/100.x。
    volumes:
      - zakura-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    # 经 docker0 访问宿主机 tailscale0 上的 Runner（100.64/10）需要主机 ip_forward=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - zakura
  caddy:
    image: caddy:2.9-alpine
    container_name: zakura-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@moonrend.com}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - zakura
    restart: unless-stopped
    networks:
      - zakura
      - headscale

  postgres:
    profiles: ["postgres"]
    # 需带 pgvector（memory embedding / migrate 0010）
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: zakura-postgres
    environment:
      POSTGRES_USER: zakura
      POSTGRES_PASSWORD: zakura
      POSTGRES_DB: zakura
    # 仅本机调试用；容器间走 zakura 网络，勿对公网暴露
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zakura
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakura -d zakura"]
      interval: 5s
      timeout: 5s
      retries: 10
  searxng:
    profiles: ["components"]
    image: searxng/searxng:latest
    container_name: zakura-searxng
    ports:
      - "8080:8080"
    networks:
      - zakura
    restart: unless-stopped

  openviking:
    profiles: ["components"]
    image: ghcr.io/volcengine/openviking:latest
    container_name: zakura-openviking
    ports:
      - "1933:1933"
    environment:
      OPENVIKING_PUBLIC_BASE_URL: http://127.0.0.1:1933
      OPENVIKING_WITH_BOT: "0"
      OPENVIKING_CONFIG_FILE: /app/.openviking/ov.conf
    volumes:
      - openviking-data:/app/.openviking
    networks:
      - zakura
    restart: unless-stopped

volumes:
  zakura-data:
  openviking-data:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  zakura:
    name: zakura
    driver: bridge
  headscale:
    name: zakura-headscale
    external: true
