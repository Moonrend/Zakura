services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zakura_test
      POSTGRES_USER: zakura
      POSTGRES_PASSWORD: zakura-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakura -d zakura_test"]
      interval: 1s
      timeout: 3s
      retries: 30
