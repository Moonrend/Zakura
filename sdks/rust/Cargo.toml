[package]
name = "zakura-sdk"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Zakura blocking REST SDK with bounded transport and explicit route parameters"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
httpdate = "1"
