# Headplane — Headscale Web UI
# api_key / cookie_secret 由部署时写入，勿提交真实密钥

server:
  host: "0.0.0.0"
  port: 3000
  base_url: "https://zakura-network.moonrend.com"
  cookie_secret: "CHANGE_ME_32_CHARS_COOKIE_SECRET!!"
  cookie_secure: true
  cookie_max_age: 86400
  data_path: "/var/lib/headplane"

headscale:
  url: "http://headscale:8080"
  public_url: "https://zakura-network.moonrend.com"
  config_path: "/etc/headscale/config.yaml"
  api_key: "REPLACE_WITH_HEADSCALE_API_KEY"

integration:
  agent:
    enabled: true
    host_name: "headplane-agent"
    cache_ttl: 180000
    work_dir: "/var/lib/headplane/agent"
  docker:
    enabled: true
    container_label: "me.tale.headplane.target=headscale"
    socket: "unix:///var/run/docker.sock"
  kubernetes:
    enabled: false
    validate_manifest: true
    pod_name: "headscale"
  proc:
    enabled: false
