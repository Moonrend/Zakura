# DCR：仅 POST /register → API；GET /register → SaaS 注册页
# 注意：元数据中 registration_endpoint 已改为 /oauth/register（见上方），此分流作兼容保留
location = /register {
    error_page 418 = @oauth_dcr;
    if ($request_method = POST) {
        return 418;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://zakura_web;
}

location @oauth_dcr {
    # named location 不能在 proxy_pass 中带 URI，用 rewrite 改写路径
    rewrite ^ /oauth/register break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://zakura_api;
}

location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://zakura_web;
}
