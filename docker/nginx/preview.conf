# preview.moonrend.com — Cloudflare Origin 证书（HTTPS）
# 证书文件挂载到 /etc/nginx/certs/（勿提交私钥到仓库）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream zakura_web {
    server zakura:3001;
}

upstream zakura_api {
    server zakura:8787;
}

server {
    listen 80;
    server_name preview.moonrend.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name preview.moonrend.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;

    include /etc/nginx/proxy_locations.conf;
}
