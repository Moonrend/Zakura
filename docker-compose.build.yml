# 本地从源码构建 server / web（覆盖 docker-compose.yml 的 image）
services:
  server:
    image: sunwuyuan/zakura-server:local
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      args:
        ZAKURA_AGENT_VERSION: ${ZAKURA_AGENT_VERSION:-dev}

  web:
    image: sunwuyuan/zakura-web:local
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        ZAKURA_API_URL: http://server:8787

  # 构建工作区镜像（不作为 compose 服务运行，仅构建用）
  # docker compose -f docker-compose.yml -f docker-compose.build.yml build workspace-full
  workspace-full:
    profiles: ["build"]
    image: sunwuyuan/zakura-workspace-dev:local
    build:
      context: docker/workspace
      dockerfile: Dockerfile
      target: full

  workspace-lite:
    profiles: ["build"]
    image: sunwuyuan/zakura-workspace-lite-dev:local
    build:
      context: docker/workspace
      dockerfile: Dockerfile
      target: base

  acp-sidecar:
    profiles: ["build"]
    image: sunwuyuan/zakura-acp-sidecar-dev:local
    build:
      context: docker/acp-sidecar
      dockerfile: Dockerfile
