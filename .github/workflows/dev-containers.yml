name: Dev Containers

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      images:
        description: "Which images to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - app
          - runner
          - workspace
          - workspace-lite

concurrency:
  group: dev-containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  meta:
    name: Resolve tags
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.resolve.outputs.owner }}
      dockerhub_user: ${{ steps.resolve.outputs.dockerhub_user }}
      images: ${{ steps.resolve.outputs.images }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Resolve
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

          DOCKERHUB_USER="${DOCKERHUB_USERNAME:-}"
          if [[ -z "${DOCKERHUB_USER}" ]]; then
            echo "::error::DOCKERHUB_USERNAME is not set (configure Actions variable DOCKERHUB_USERNAME)"
            exit 1
          fi
          echo "dockerhub_user=${DOCKERHUB_USER,,}" >> "$GITHUB_OUTPUT"

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IMAGES="${{ inputs.images }}"
          else
            IMAGES="all"
          fi
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"

          echo "Resolved sha=${SHORT_SHA} images=${IMAGES}"

  build:
    name: Build ${{ matrix.name }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: zakura-dev
            dockerfile: docker/Dockerfile
            context: .
            timeout: 60
            workspace_tags: "false"
            build_args: ""
            target: ""
          - name: runner
            image: zakura-runner-dev
            dockerfile: docker/runner/Dockerfile
            context: .
            timeout: 60
            workspace_tags: "false"
            build_args: ""
            target: ""
          - name: workspace
            image: zakura-workspace-dev
            dockerfile: docker/workspace/Dockerfile
            context: docker/workspace
            timeout: 180
            workspace_tags: "true"
            build_args: "APT_MIRROR=http://deb.debian.org"
            target: ""
          - name: workspace-lite
            image: zakura-workspace-lite-dev
            dockerfile: docker/workspace/Dockerfile
            context: docker/workspace
            timeout: 180
            workspace_tags: "false"
            build_args: "APT_MIRROR=http://deb.debian.org"
            target: base
    steps:
      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          IMAGES="${{ needs.meta.outputs.images }}"
          NAME="${{ matrix.name }}"
          if [[ "${IMAGES}" == "all" || "${IMAGES}" == "${NAME}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${NAME} (images=${IMAGES})"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: steps.gate.outputs.run == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ needs.meta.outputs.owner }}/${{ matrix.image }}
            ${{ needs.meta.outputs.dockerhub_user }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ needs.meta.outputs.short_sha }}
            type=raw,value=debian,enable=${{ matrix.workspace_tags == 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=dev-${{ needs.meta.outputs.short_sha }}

      - name: Build and push
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          target: ${{ matrix.target }}
          cache-from: type=gha,scope=dev-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.image }}
          provenance: false
