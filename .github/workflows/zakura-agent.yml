name: zakura-agent

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "go/agent/**"
      - ".github/workflows/zakura-agent.yml"

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./...
      - name: pack binaries
        env:
          ZAKURA_AGENT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: bash scripts/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zakura-agent-binaries
          path: |
            go/agent/dist/zakura-agent_*
            go/agent/dist/VERSION
            go/agent/dist/checksums.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: go/agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: zakura-agent-binaries
          path: go/agent/dist
      - name: attach raw binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            go/agent/dist/zakura-agent_* \
            go/agent/dist/VERSION \
            go/agent/dist/checksums.txt \
            --clobber
