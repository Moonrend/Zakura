name: sdk-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sdks/**'
      - 'scripts/sdk/**'
      - 'apps/server/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/sdk-validation.yml'
  push:
    paths:
      - 'sdks/**'
      - 'scripts/sdk/**'
      - 'apps/server/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/sdk-validation.yml'

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Check SDK generation against the server router
        run: |
          (cd apps/server && go run ./cmd/zakura-route-catalog) > "$RUNNER_TEMP/zakura-routes.json"
          python3 scripts/sdk/generate.py --check --routes "$RUNNER_TEMP/zakura-routes.json"
      - name: Go transport tests
        working-directory: sdks/go
        run: |
          go test -race ./...
          go vet ./...
      - name: TypeScript type checking and transport tests
        run: |
          corepack pnpm --filter @zakura/sdk typecheck
          corepack pnpm --filter @zakura/sdk test
          corepack pnpm --filter @zakura/sdk build
      - name: Python transport tests and package build
        working-directory: sdks/python
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests -v
          python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/zakura-python-wheel" .
      - name: Rust transport tests and lint
        working-directory: sdks/rust
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Execute every registered operation in all four SDKs
        run: python3 scripts/sdk/verify_routes.py --routes "$RUNNER_TEMP/zakura-routes.json"
      - name: Report production source lines
        run: python3 scripts/sdk/count_source.py
